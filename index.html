<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cormux</title>
    <!-- Pick the theme and paint its background before app.css loads so boot doesn't flash. -->
    <script>
      // Same key and values ModeWatcher persists from Settings > Appearance.
      const saved = localStorage.getItem('mode-watcher-mode')
      const mode = saved === 'light' || saved === 'dark' ? saved : 'system'
      if (
        mode === 'dark' ||
        (mode === 'system' &&
          matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.documentElement.classList.add('dark')
      }
    </script>
    <style>
      html {
        color-scheme: light;
        background: #f5f6f7;
      }
      html.dark {
        color-scheme: dark;
        background: #0b0c0e;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
