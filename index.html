<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cormux</title>
    <!-- Apply Settings > Appearance and paint the background before app.css loads so boot doesn't flash. -->
    <script>
      {
        // Keys and values match mode-watcher and src/lib/state/appearance.svelte.ts.
        const read = (key) => {
          try {
            return localStorage.getItem(key)
          } catch {
            return null
          }
        }
        const root = document.documentElement
        const saved = read('mode-watcher-mode')
        const mode = saved === 'light' || saved === 'dark' ? saved : 'system'
        if (
          mode === 'dark' ||
          (mode === 'system' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          root.classList.add('dark')
        }
        const felt = read('cormux-felt')
        if (
          felt === 'strawberry' ||
          felt === 'lemonade' ||
          felt === 'grape' ||
          felt === 'seaside'
        ) {
          root.dataset.felt = felt
        }
        const uiSize = Number(read('cormux-ui-font-size'))
        if (uiSize >= 14 && uiSize <= 18) root.style.fontSize = uiSize + 'px'
        const codeSize = Number(read('cormux-code-font-size'))
        if (codeSize >= 11 && codeSize <= 16) {
          root.style.setProperty('--code-font-size', codeSize + 'px')
        }
      }
    </script>
    <style>
      html {
        color-scheme: light;
        background: #bfd8e6;
      }
      html[data-felt='strawberry'] {
        background: #f6cbd3;
      }
      html[data-felt='lemonade'] {
        background: #f6e39e;
      }
      html[data-felt='grape'] {
        background: #d4caf1;
      }
      html[data-felt='seaside'] {
        background: #bee6d6;
      }
      html.dark {
        color-scheme: dark;
        background: #1f2a28;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
