<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cormux</title>
    <!-- Apply Settings > Appearance before app.css loads so boot doesn't flash. -->
    <script>
      {
        // The mode key is mode-watcher's; the rest come from appearance-tokens.ts, put in
        // at build time (vite.config.ts).
        const tokens = __APPEARANCE_TOKENS__
        const read = (key) => {
          try {
            return localStorage.getItem(key)
          } catch {
            return null
          }
        }
        const root = document.documentElement
        const saved = read('mode-watcher-mode')
        const mode = saved === 'light' || saved === 'dark' ? saved : 'system'
        if (
          mode === 'dark' ||
          (mode === 'system' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          root.classList.add('dark')
        }
        const theme = read(tokens.keys.theme) || tokens.defaultTheme
        if (theme !== 'neutral') root.dataset.palette = theme
        // First paint in the theme's own gradient, matching Backdrop.svelte and
        // the theme tokens in app.css, rather than a flat grey until styles load.
        const palettes = tokens.palettes
        const isDark = root.classList.contains('dark')
        const [hue, strength] = palettes[theme] ?? [265, 0]
        const base = palettes[theme]
          ? isDark
            ? `oklch(0.25 ${0.12 * strength} ${hue})`
            : `oklch(0.72 ${0.13 * strength} ${hue})`
          : isDark
            ? 'oklch(0.13 0.012 265)'
            : 'oklch(0.93 0.01 265)'
        const high = palettes[theme]
          ? isDark
            ? `oklch(0.42 ${0.17 * strength} ${hue})`
            : `oklch(0.86 ${0.09 * strength} ${hue})`
          : isDark
            ? 'oklch(0.2 0.015 265)'
            : 'oklch(0.975 0.006 265)'
        root.style.background = `radial-gradient(120% 110% at 90% -10%, ${high}, transparent 70%) fixed, ${base}`
        const uiSize = Number(read(tokens.keys.uiFontSize))
        if (tokens.uiFontSizes.includes(uiSize)) {
          root.style.fontSize = uiSize + 'px'
        }
        const codeSize = Number(read(tokens.keys.codeFontSize))
        if (tokens.codeFontSizes.includes(codeSize)) {
          root.style.setProperty('--code-font-size', codeSize + 'px')
        }
        const codeFont = tokens.codeFonts[read(tokens.keys.codeFont)]
        if (codeFont) root.style.setProperty('--code-font-family', codeFont)
      }
    </script>
    <style>
      html {
        color-scheme: light;
        background: #f5f6f7;
      }
      html.dark {
        color-scheme: dark;
        background: #0b0c0e;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
