<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cormux</title>
    <!-- Apply Settings > Appearance and paint the background before app.css loads so boot doesn't flash. -->
    <script>
      {
        // Keys and values match mode-watcher and src/lib/state/appearance.svelte.ts.
        const read = (key) => {
          try {
            return localStorage.getItem(key)
          } catch {
            return null
          }
        }
        const root = document.documentElement
        const saved = read('mode-watcher-mode')
        const mode = saved === 'light' || saved === 'dark' ? saved : 'system'
        if (
          mode === 'dark' ||
          (mode === 'system' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          root.classList.add('dark')
        }
        // Blue is the default; a custom accent sets --primary inline, with
        // the foreground picked like readableForeground in background/color.ts.
        const accent = read('cormux-accent') || 'blue'
        if (accent !== 'neutral') root.dataset.accent = accent
        const custom = read('cormux-accent-custom')
        if (accent === 'custom' && /^#[0-9a-f]{6}$/i.test(custom || '')) {
          const n = parseInt(custom.slice(1), 16)
          const lin = (c) => {
            c /= 255
            return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4
          }
          const lum =
            0.2126 * lin((n >> 16) & 255) +
            0.7152 * lin((n >> 8) & 255) +
            0.0722 * lin(n & 255)
          // Contrast against #17171c (luminance ~0.0088) versus white.
          const dark = (lum + 0.05) / 0.0588 > 1.05 / (lum + 0.05)
          root.style.setProperty('--primary', custom)
          root.style.setProperty(
            '--primary-foreground',
            dark ? '#17171c' : '#ffffff',
          )
        }
        // Ids match BACKGROUNDS in src/lib/background/registry.ts.
        root.dataset.background = read('cormux-background') || 'studio'
        const uiSize = Number(read('cormux-ui-font-size'))
        if (uiSize >= 14 && uiSize <= 18) root.style.fontSize = uiSize + 'px'
        const codeSize = Number(read('cormux-code-font-size'))
        if (codeSize >= 11 && codeSize <= 16) {
          root.style.setProperty('--code-font-size', codeSize + 'px')
        }
        // Ids and stacks match CODE_FONTS in appearance.svelte.ts.
        const codeFonts = {
          jetbrains:
            "'JetBrains Mono Variable', ui-monospace, 'SF Mono', Menlo, monospace",
          system: "ui-monospace, 'SF Mono', Menlo, monospace",
          geist:
            "'Geist Mono Variable', ui-monospace, 'SF Mono', Menlo, monospace",
        }
        const codeFont = read('cormux-code-font')
        if (codeFont && codeFonts[codeFont]) {
          root.style.setProperty('--code-font-family', codeFonts[codeFont])
        }
      }
    </script>
    <style>
      html {
        color-scheme: light;
        background: #f5f6f7;
      }
      html.dark {
        color-scheme: dark;
        background: #0b0c0e;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
