[package]
name = "cormux"
version = "0.1.0"
description = "Run many coding agents in parallel, each in its own git worktree"
authors = ["Cormac Williamson"]
license = "UNLICENSED"
repository = "https://github.com/cormacrw/cormux"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "cormux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde", "serde_json"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-dialog = "2.8.0"
tauri-plugin-opener = "2.6.0"
tauri-plugin-notification = "2.5.0"
agent-client-protocol = "2.2.0"
portable-pty = "0.9.0"
libc = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
notify = "8"
ignore = "0.4"
sysinfo = "0.33"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
