[package]
name = "harness"
version = "0.1.0"
description = "Run many coding agents in parallel, each in its own git worktree"
authors = ["Cormac Williamson"]
license = "UNLICENSED"
repository = "https://github.com/cormacrw/cormux"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde", "serde_json"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
