[[permission]]
identifier = "allow-ipc"
description = "Allow the webview to call Cormux core commands"
commands.allow = [
  "get_snapshot",
  "reload_environment",
  "fetch_on_focus",
  "get_metrics",
  "subscribe_agent_chunks",
  "subscribe_agent_events",
  "subscribe_pty",
  "subscribe_diffs",
  "detect_engines",
  "send_thread_prompt",
  "cancel_thread_turn",
  "pause_thread",
  "resume_thread",
  "resolve_approval",
  "resolve_all_approvals",
  "summarise_workspace",
  "set_github_token",
  "clear_github_token",
  "sync_pull_requests",
  "list_repo_branches",
  "create_workspace",
  "retry_workspace_provisioning",
  "skip_workspace_provisioning_setup",
  "join_workspace_thread",
  "rename_workspace",
  "get_teardown_preview",
  "teardown_workspace",
  "start_streaming_spike",
  "control_workspace_app",
  "set_repo_run_command"
]
