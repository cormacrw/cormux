name: Release

# Every push to main publishes a GitHub Release for the version in
# src-tauri/tauri.conf.json, unless a release for that version already exists.
# Bump the version (tauri.conf.json and Cargo.toml) to cut a new one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Manual runs are allowed, but only from main.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip if v${{ steps.version.outputs.version }} is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "v${{ steps.version.outputs.version }} is already released; bump the version to publish a new one."
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.existing.outputs.released != 'true'
        with:
          version: 8

      - uses: actions/setup-node@v4
        if: steps.existing.outputs.released != 'true'
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        if: steps.existing.outputs.released != 'true'
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        if: steps.existing.outputs.released != 'true'
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        if: steps.existing.outputs.released != 'true'
        run: pnpm install --frozen-lockfile

      # One universal .dmg that runs on Apple Silicon and Intel Macs. The app isn't
      # signed with an Apple Developer ID yet, so the notes explain how to open it.
      - uses: tauri-apps/tauri-action@v1
        if: steps.existing.outputs.released != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Cormux v__VERSION__
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
          releaseBody: |
            Download the `.dmg`, open it, and drag Cormux to Applications. It needs macOS 13 or later and runs on Apple Silicon and Intel Macs.

            This build isn't signed with an Apple Developer ID, so macOS will say it's damaged or can't be opened. After installing, run this once in Terminal:

            ```sh
            xattr -dr com.apple.quarantine /Applications/Cormux.app
            ```
